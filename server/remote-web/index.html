
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AirClick Remote</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(200.96deg, #2d3748 0%, #1a202c 47.67%, #171923 100%);
      color: white;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
    }
    
    header {
      text-align: center;
      padding: 20px 0;
    }
    
    h1 {
      font-size: 24px;
      color: #63b3ed;
      margin-bottom: 5px;
    }
    
    .status {
      color: #a0aec0;
      font-size: 14px;
    }
    
    .connected {
      color: #48bb78;
    }
    
    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      padding: 20px 0;
    }
    
    .button {
      background-color: rgba(45, 55, 72, 0.5);
      border: 2px solid rgba(99, 179, 237, 0.5);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    
    .button:active {
      background-color: rgba(99, 179, 237, 0.3);
      transform: scale(0.98);
    }
    
    .button svg {
      width: 24px;
      height: 24px;
      margin-right: 10px;
    }
    
    .button-row {
      display: flex;
      gap: 20px;
    }
    
    .button-row .button {
      flex: 1;
    }
    
    footer {
      text-align: center;
      padding: 20px 0;
      color: #a0aec0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AirClick Remote</h1>
      <div class="status">Connecting...</div>
    </header>
    
    <div class="controls">
      <div class="button-row">
        <div class="button" id="previous">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.95 5l-9.97 7 9.97 7V5zm-11.97 0v14H5V5h2.98z"/>
          </svg>
          Previous
        </div>
        <div class="button" id="next">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 5v14l9.97-7L4 5zm11.03 0v14H18V5h-2.97z"/>
          </svg>
          Next
        </div>
      </div>
      
      <div class="button" id="play-pause">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        Play/Pause
      </div>
    </div>
    
    <footer>
      <p>Connected to AirClick Desktop</p>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const statusEl = document.querySelector('.status');
      const playPauseBtn = document.getElementById('play-pause');
      const nextBtn = document.getElementById('next');
      const previousBtn = document.getElementById('previous');
      
      // Connect to WebSocket server
      const socket = io();
      
      // Update connection status
      socket.on('connect', () => {
        statusEl.textContent = 'Connected';
        statusEl.classList.add('connected');
      });
      
      socket.on('disconnect', () => {
        statusEl.textContent = 'Disconnected';
        statusEl.classList.remove('connected');
      });
      
      // Add event listeners for buttons
      playPauseBtn.addEventListener('click', () => {
        socket.emit('media-command', 'play-pause');
        
        // Visual feedback
        playPauseBtn.style.backgroundColor = 'rgba(99, 179, 237, 0.3)';
        setTimeout(() => {
          playPauseBtn.style.backgroundColor = '';
        }, 200);
      });
      
      nextBtn.addEventListener('click', () => {
        socket.emit('media-command', 'next');
        
        // Visual feedback
        nextBtn.style.backgroundColor = 'rgba(99, 179, 237, 0.3)';
        setTimeout(() => {
          nextBtn.style.backgroundColor = '';
        }, 200);
      });
      
      previousBtn.addEventListener('click', () => {
        socket.emit('media-command', 'previous');
        
        // Visual feedback
        previousBtn.style.backgroundColor = 'rgba(99, 179, 237, 0.3)';
        setTimeout(() => {
          previousBtn.style.backgroundColor = '';
        }, 200);
      });
      
      // Prevent default touch behavior to avoid delays
      document.addEventListener('touchstart', (e) => {
        if (e.target.closest('.button')) {
          e.preventDefault();
        }
      }, { passive: false });
    });
  </script>
</body>
</html>
